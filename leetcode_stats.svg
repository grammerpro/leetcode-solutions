<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="100%" height="100%">
    <style>
        .title { font-family: 'Inter', -apple-system, system-ui, sans-serif; font-size: 20px; font-weight: 800; fill: #F3F4F6; }
        .subtitle { font-family: 'Inter', sans-serif; font-size: 11px; fill: #9CA3AF; letter-spacing: 1.5px; font-weight: 600; }
        .header-line { stroke: #1F2937; stroke-width: 1; }
        .card-bg { fill: #111827; stroke: #1F2937; stroke-width: 1; rx: 12px; }
        .stat-val { font-family: 'Inter', sans-serif; font-size: 32px; font-weight: 800; }
        .label { font-family: 'Inter', sans-serif; font-size: 14px; fill: #9CA3AF; font-weight: 500; }
        .timeline-title { font-family: 'Inter', sans-serif; font-size: 14px; fill: #E5E7EB; font-weight: 600; }
        .timeline-desc { font-family: 'Inter', sans-serif; font-size: 12px; fill: #9CA3AF; }
        .timeline-date { font-family: 'Inter', sans-serif; font-size: 11px; fill: #6B7280; }
        .glow { filter: drop-shadow(0px 0px 8px var(--glow-color)); }
    </style>
    
    <!-- Deep slate background card -->
    <rect width="800" height="430" rx="16" fill="#0B0F19" stroke="#1F2937" stroke-width="1.5"/>
    
    <!-- Title -->
    <text x="30" y="42" class="title">LeetCode Solutions Dashboard</text>
    <text x="30" y="62" class="subtitle">AUTOMATED PROGRESS TRACKER</text>
    <line x1="30" y1="80" x2="770" y2="80" class="header-line"/>
    
    <!-- STATS CARDS -->
    <!-- Card 1: Solved -->
    <rect x="30" y="100" width="230" height="100" class="card-bg"/>
    <text x="50" y="130" class="subtitle">TOTAL SOLVED</text>
    <text x="50" y="175" class="stat-val" fill="#3B82F6">14</text>
    
    <!-- Card 2: Streak -->
    <rect x="285" y="100" width="230" height="100" class="card-bg"/>
    <text x="305" y="130" class="subtitle">CURRENT STREAK</text>
    <text x="305" y="175" class="stat-val" fill="#EC4899" style="--glow-color: rgba(236,72,153,0.3);">1 Days</text>
    
    <!-- Card 3: Completion -->
    <rect x="540" y="100" width="230" height="100" class="card-bg"/>
    <text x="560" y="130" class="subtitle">SUCCESS RATE</text>
    <text x="560" y="175" class="stat-val" fill="#10B981">100%</text>
    
    <!-- SECTION 2: BREAKDOWN -->
    <!-- Left Pane: Difficulties -->
    <text x="30" y="240" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#F3F4F6">Difficulty Distribution</text>
    
    <!-- Easy Bar -->
    <text x="30" y="278" class="label">Easy</text>
    <rect x="110" y="266" width="200" height="14" rx="7" fill="#1F2937"/>
    <rect x="110" y="266" width="100" height="14" rx="7" fill="#10B981"/>
    <text x="325" y="278" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#10B981">7 (50%)</text>
    
    <!-- Medium Bar -->
    <text x="30" y="323" class="label">Medium</text>
    <rect x="110" y="311" width="200" height="14" rx="7" fill="#1F2937"/>
    <rect x="110" y="311" width="100" height="14" rx="7" fill="#F59E0B"/>
    <text x="325" y="323" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F59E0B">7 (50%)</text>
    
    <!-- Dynamic Progress Ring on the Right -->
    <circle cx="110" cy="380" r="8" fill="#10B981"/>
    <text x="128" y="386" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#E5E7EB">Ready for Hard Challenges</text>
    
    <!-- Vertical Divider -->
    <line x1="435" y1="225" x2="435" y2="400" stroke="#1F2937" stroke-width="1.5"/>
    
    <!-- Right Pane: Timeline Activity -->
    <text x="460" y="240" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#F3F4F6">Recent Submissions</text>
    
    <!-- Timeline Vertical Line -->
    <line x1="475" y1="260" x2="475" y2="390" stroke="#1F2937" stroke-width="2"/>
    
    <!-- Node 0 -->
    <circle cx="475" cy="275" r="6" fill="#F59E0B" stroke="#0B0F19" stroke-width="2"/>
    <text x="495" y="270" class="timeline-title">Word Break</text>
    <text x="495" y="287" class="timeline-desc">Medium • <tspan class="timeline-date">Jun 03, 16:32</tspan></text>
        
    <!-- Node 1 -->
    <circle cx="475" cy="330" r="6" fill="#F59E0B" stroke="#0B0F19" stroke-width="2"/>
    <text x="495" y="325" class="timeline-title">Decode Ways</text>
    <text x="495" y="342" class="timeline-desc">Medium • <tspan class="timeline-date">Jun 03, 16:22</tspan></text>
        
    <!-- Node 2 -->
    <circle cx="475" cy="385" r="6" fill="#10B981" stroke="#0B0F19" stroke-width="2"/>
    <text x="495" y="380" class="timeline-title">Invert Binary Tree</text>
    <text x="495" y="397" class="timeline-desc">Easy • <tspan class="timeline-date">May 30, 16:38</tspan></text>
        
</svg>